name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL database for the integration tests
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_CONNECTION: Host=localhost;Port=5432;Database=norskhandverk_test;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore NorskHandverk.sln

      - name: Build
        run: dotnet build NorskHandverk.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test NorskHandverk.sln --configuration Release --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FrontEnd/norskhandelfe

    # Placeholder values: the build only needs them to exist
    env:
      NEXT_PUBLIC_BASE_API_URL: https://localhost:7140/api
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FrontEnd/norskhandelfe/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
